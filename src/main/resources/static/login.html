<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Server - Login</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">
    <div class="card">

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Sign in to your OAuth account
    </p>

    <form id="loginForm">

        <div class="form-group">
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
                autocomplete="username"
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
            >
        </div>

        <button type="submit">
            Log In
        </button>

    </form>

    <p id="message" class="message"></p>

    <button
        type="button"
        class="secondary-button"
        onclick="window.location.href='/register.html'"
    >
        Create an Account
    </button>

</div>

</div>

<script src="/auth.js"></script>

<script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {

        // Prevent the browser from performing a normal form submission.
        event.preventDefault();

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;

        message.textContent = "Logging in...";
        message.className = "message";

        try {

        const response = await fetch("/auth/login", {
             method: "POST",
            headers: {
                "Content-Type": "application/json"
             },
             body: JSON.stringify({
                  username: username,
                  password: password
              })
        });

            const responseText = await response.text();
            const data = responseText ? JSON.parse(responseText) : {};

            console.log("HTTP status:", response.status);
            console.log("Content-Type:", response.headers.get("content-type"));
            console.log("Server response:", responseText); 

            /*
             * Login failed.
             */
            if (!response.ok) {

                message.textContent = data.message || "Invalid username or password.";
                message.className = "message error";
                return;
            }

            /*
             * Make sure the backend actually returned an access token.
             */
            if (!data.accessToken) {

                console.error("Login response did not contain accessToken:", data);

                message.textContent =
                    "Login succeeded, but no access token was returned.";

                message.className = "message error";

                return;
            }

            /*
             * Store the JWT and refresh token.
             */
            sessionStorage.setItem(
                "accessToken",
                data.accessToken
            );

            if (data.refreshToken) {
                sessionStorage.setItem(
                    "refreshToken",
                    data.refreshToken
                );
            }

            /*
             * Store username.
             *
             * If the backend returns a username, use it.
             * Otherwise use the username entered in the form.
             */
            sessionStorage.setItem(
                "username",
                data.username || username
            );

            /*
             * Login was successful.
             * Send the user to the protected dashboard.
             */
            window.location.href = "/dashboard.html";

        } catch (error) {

            console.error("Login error:", error);

            message.textContent =
                "Unable to connect to the OAuth server.";

            message.className = "message error";
        }
    });
</script>

</body>
</html>
