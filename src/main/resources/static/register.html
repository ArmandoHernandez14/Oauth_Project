<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Server - Register</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">
    <div class="card">

    <h1>Create Account</h1>

    <p class="subtitle">
        Register for an OAuth account
    </p>

    <form id="registerForm">

        <div class="form-group">
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username"
                required
                minlength="3"
                autocomplete="username"
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Choose a password"
                required
                minlength="8"
                autocomplete="new-password"
            >
        </div>

        <div class="form-group">
            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Enter your password again"
                required
                minlength="8"
                autocomplete="new-password"
            >
        </div>

        <button type="submit">
            Register
        </button>

    </form>

    <p id="message" class="message"></p>

    <button
        type="button"
        class="secondary-button"
        onclick="window.location.href='/login.html'"
    >
        Back to Login
    </button>

</div>

</div>

<script src="/auth.js"></script>

<script>

    const registerForm =
        document.getElementById("registerForm");

    const message =
        document.getElementById("message");

    registerForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username")
                    .value.trim();

            const password =
                document.getElementById("password")
                    .value;

            const confirmPassword =
                document.getElementById("confirmPassword")
                    .value;

            if (password !== confirmPassword) {

                message.textContent =
                    "Passwords do not match.";

                message.className =
                    "message error";

                return;
            }

            message.textContent =
                "Creating your account...";

            message.className =
                "message";

            try {

                const response = await fetch(
                    "/auth/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );

                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(errorText);

                    message.textContent =
                        "Registration failed. " +
                        "The username may already exist.";

                    message.className =
                        "message error";

                    return;
                }

                message.textContent =
                    "Account created successfully! " +
                    "Redirecting to login...";

                message.className =
                    "message success";

                setTimeout(function() {

                    window.location.href =
                        "/login.html";

                }, 1500);

            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to connect to the OAuth server.";

                message.className =
                    "message error";
            }
        }
    );

</script>

</body>
</html>
